# Tema do painel Vértice Retail, seguindo o Vértice Retail Design System:
# indigo de marca sobre off-white por padrão, navy como única superfície escura
# (botão "Tema escuro" no cabeçalho, via ?tema=escuro&embed_options=dark_theme).
# Estas cores valem para os controles nativos (tabelas, sliders, botões,
# alternadores); o CSS e os gráficos usam a mesma paleta em app.py.
[theme]
baseRadius = "6px"
showWidgetBorder = true
font = "sans serif"

[theme.light]
primaryColor = "#1A1AC8"
backgroundColor = "#F6F6F4"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#17171B"
borderColor = "#E3E3DF"
dataframeBorderColor = "#E3E3DF"
dataframeHeaderBackgroundColor = "#EDEDE9"

[theme.dark]
primaryColor = "#6B69E8"
backgroundColor = "#0E2036"
secondaryBackgroundColor = "#16304C"
textColor = "#FFFFFF"
borderColor = "#27425F"
dataframeBorderColor = "#27425F"
dataframeHeaderBackgroundColor = "#1F4266"

[client]
toolbarMode = "minimal"
